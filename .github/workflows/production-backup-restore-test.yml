name: Production backup restore test

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-backup-restore-test
  cancel-in-progress: false

env:
  AWS_REGION: eu-north-1
  BACKUP_BUCKET: ofa-prod-backups-521390384594

jobs:
  restore-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: public.ecr.aws/supabase/postgres:17.6.1.155
        env:
          POSTGRES_PASSWORD: isolated-restore-only
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Validate the GitHub OIDC identity
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")"
          token="$(jq -er '.value' <<<"$response")"
          OIDC_TOKEN="$token" node <<'NODE'
          const payload = JSON.parse(Buffer.from(process.env.OIDC_TOKEN.split('.')[1], 'base64url'));
          const expectedSubject = 'repo:rumanstano-cyber@313154210/osobny-financny-asistent@1323407617:ref:refs/heads/main';
          if (payload.aud !== 'sts.amazonaws.com' || payload.sub !== expectedSubject) {
            throw new Error(`Unexpected GitHub OIDC claims: aud=${JSON.stringify(payload.aud)}, sub=${JSON.stringify(payload.sub)}`);
          }
          console.log('GitHub OIDC audience and repository/branch subject are valid.');
          NODE

      - name: Obtain short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: arn:aws:iam::521390384594:role/OFAProductionBackupGitHubRole
          role-session-name: ofa-production-restore-test
          aws-region: ${{ env.AWS_REGION }}

      - name: Restore the latest backup into an isolated runner
        shell: bash
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          umask 077
          restore_dir="$(mktemp -d)"
          trap 'rm -rf "$restore_dir"' EXIT

          prefix="$(aws s3 cp "s3://${BACKUP_BUCKET}/latest.json" - --only-show-errors | jq -er '.prefix')"
          case "$prefix" in
            production/*/) ;;
            *) echo "The latest backup pointer is invalid." >&2; exit 1 ;;
          esac
          aws s3 cp "s3://${BACKUP_BUCKET}/${prefix}" "$restore_dir/" \
            --recursive \
            --only-show-errors

          RESTORE_DIRECTORY="$restore_dir" node <<'NODE'
          const { createHash } = require('node:crypto');
          const { readFileSync } = require('node:fs');
          const { resolve, sep } = require('node:path');

          const root = resolve(process.env.RESTORE_DIRECTORY);
          const checksumLines = readFileSync(resolve(root, 'SHA256SUMS'), 'utf8')
            .split('\n')
            .filter(Boolean);
          for (const line of checksumLines) {
            const match = /^([a-f0-9]{64})  (.+)$/u.exec(line);
            if (!match) throw new Error('Invalid checksum manifest');
            const file = resolve(root, match[2]);
            if (!file.startsWith(`${root}${sep}`)) throw new Error('Unsafe checksum path');
            const actual = createHash('sha256').update(readFileSync(file)).digest('hex');
            if (actual !== match[1]) throw new Error('Backup checksum mismatch');
          }

          const storage = JSON.parse(readFileSync(resolve(root, 'storage/manifest.json'), 'utf8'));
          for (const object of storage.objects) {
            const file = resolve(root, 'storage/objects', object.key);
            if (!file.startsWith(`${resolve(root, 'storage/objects')}${sep}`)) {
              throw new Error('Unsafe Storage restore path');
            }
            const actual = createHash('sha256').update(readFileSync(file)).digest('hex');
            if (actual !== object.sha256) throw new Error('Storage object checksum mismatch');
          }
          console.log('Backup files and Storage objects passed integrity verification.');
          NODE

          # The restore database is disconnected before production data is loaded,
          # so restored cron jobs or functions cannot call any external service.
          for network in $(docker inspect -f '{{range $key, $value := .NetworkSettings.Networks}}{{$key}} {{end}}' "$POSTGRES_CONTAINER_ID"); do
            docker network disconnect "$network" "$POSTGRES_CONTAINER_ID"
          done

          docker cp "$restore_dir/database/roles.sql" "$POSTGRES_CONTAINER_ID:/tmp/roles.sql"
          docker cp "$restore_dir/database/schema.sql" "$POSTGRES_CONTAINER_ID:/tmp/schema.sql"
          docker cp "$restore_dir/database/data.sql" "$POSTGRES_CONTAINER_ID:/tmp/data.sql"

          # A role-only Supabase dump can ALTER platform roles that are created by
          # the managed service but are not present in a bare restore container.
          # Pre-create only those roles, then let the verified dump restore their
          # exact attributes and memberships.
          RESTORE_DIRECTORY="$restore_dir" node <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs');
          const { resolve } = require('node:path');

          const root = resolve(process.env.RESTORE_DIRECTORY);
          const roleDump = readFileSync(resolve(root, 'database/roles.sql'), 'utf8');
          const roles = new Set();
          const alterRole = /^\s*ALTER\s+ROLE\s+(?:"((?:[^"]|"")+)"|([A-Za-z_][A-Za-z0-9_$]*))/gimu;
          for (const match of roleDump.matchAll(alterRole)) {
            roles.add(match[1] ? match[1].replaceAll('""', '"') : match[2]);
          }
          if (roles.size === 0) throw new Error('No roles found in the verified role dump');

          const statements = [...roles].map((role) => {
            const literal = role.replaceAll("'", "''");
            return `DO $role$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '${literal}') THEN EXECUTE format('CREATE ROLE %I', '${literal}'); END IF; END $role$;`;
          });
          writeFileSync(resolve(root, 'database/precreate-roles.sql'), `${statements.join('\n')}\n`, { mode: 0o600 });
          NODE
          docker cp "$restore_dir/database/precreate-roles.sql" "$POSTGRES_CONTAINER_ID:/tmp/precreate-roles.sql"

          docker exec "$POSTGRES_CONTAINER_ID" \
            psql -v ON_ERROR_STOP=1 -U postgres -d postgres -f /tmp/precreate-roles.sql >/dev/null
          docker exec "$POSTGRES_CONTAINER_ID" \
            psql -v ON_ERROR_STOP=1 -U postgres -d postgres -f /tmp/roles.sql >/dev/null
          docker exec "$POSTGRES_CONTAINER_ID" \
            psql -v ON_ERROR_STOP=1 -U postgres -d postgres \
            -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;' >/dev/null
          docker exec "$POSTGRES_CONTAINER_ID" \
            psql -v ON_ERROR_STOP=1 -U postgres -d postgres -f /tmp/schema.sql >/dev/null
          docker exec "$POSTGRES_CONTAINER_ID" \
            psql -v ON_ERROR_STOP=1 -U postgres -d postgres -f /tmp/data.sql >/dev/null
          docker exec "$POSTGRES_CONTAINER_ID" \
            psql -v ON_ERROR_STOP=1 -U postgres -d postgres -Atqc \
            "select case when to_regclass('public.financial_transactions') is not null
              and to_regclass('public.stored_files') is not null
              and to_regclass('public.ofa_receipts') is not null
              then 'restore-ok' else 'restore-invalid' end" \
            | grep -qx 'restore-ok'

          echo "Database and receipt files restored successfully in the isolated runner."
